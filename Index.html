<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مواقيت الصلاة</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }

  #main-frame {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* شريط المعلومات */
  #info-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 36px;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 9999;
    backdrop-filter: blur(8px);
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  #mode-label {
    color: #f0c040;
    font-size: 13px;
    letter-spacing: 1px;
    font-weight: 600;
  }

  #countdown-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #ccc;
    font-size: 12px;
  }

  #countdown {
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    min-width: 42px;
    text-align: center;
  }

  #progress-bar-bg {
    width: 160px;
    height: 4px;
    background: rgba(255,255,255,0.12);
    border-radius: 2px;
    overflow: hidden;
  }

  #progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #f0c040, #e07020);
    border-radius: 2px;
    transition: width 1s linear;
  }

  #dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4caf50;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* انتقال ناعم */
  #main-frame {
    transition: opacity 0.6s ease;
  }

  #main-frame.fade-out {
    opacity: 0;
  }
</style>
</head>
<body>

<iframe id="main-frame" src="https://mawaqit.net/ar/byty-saarbrucken-66115-germany" allowfullscreen></iframe>

<div id="info-bar">
  <div id="mode-label">🕌 مواقيت الصلاة</div>
  <div id="countdown-wrap">
    <div id="dot"></div>
    <span id="phase-text">التبديل بعد:</span>
    <span id="countdown">--:--</span>
    <div id="progress-bar-bg">
      <div id="progress-bar-fill" style="width:100%"></div>
    </div>
  </div>
</div>

<script>
  // ============================================================
  // الإعدادات - غيّر هنا فقط
  // ============================================================
  const PRAYER_URL   = 'https://mawaqit.net/ar/byty-saarbrucken-66115-germany';
  const OTHER_URLS   = [
    'https://forecast7.com/ar/49d247d007d00/saarbrucken/',
    // أضف روابط إضافية هنا إن أردت
  ];

  const PRAYER_DURATION = 15 * 60;   // 15 دقيقة لصفحة المواقيت
  const OTHER_DURATION  = 15 * 60;   // 15 دقيقة للصفحات الأخرى (مجموع)
  const EACH_OTHER_DURATION = Math.floor(OTHER_DURATION / OTHER_URLS.length); // وقت كل صفحة
  // ============================================================

  const frame       = document.getElementById('main-frame');
  const modeLabel   = document.getElementById('mode-label');
  const countdown   = document.getElementById('countdown');
  const progressBar = document.getElementById('progress-bar-fill');
  const phaseText   = document.getElementById('phase-text');

  let currentPhase  = 'prayer';   // 'prayer' أو 'other'
  let otherIndex    = 0;
  let timeLeft      = PRAYER_DURATION;
  let totalTime     = PRAYER_DURATION;

  const PHASE_NAMES = {
    prayer: '🕌 مواقيت الصلاة',
    other:  '🌤️ الطقس'
  };

  function formatTime(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = (sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function loadURL(url) {
    frame.classList.add('fade-out');
    setTimeout(() => {
      frame.src = url;
      frame.classList.remove('fade-out');
    }, 600);
  }

  function switchToPrayer() {
    currentPhase = 'prayer';
    timeLeft     = PRAYER_DURATION;
    totalTime    = PRAYER_DURATION;
    otherIndex   = 0;
    modeLabel.textContent = PHASE_NAMES.prayer;
    phaseText.textContent = 'التبديل بعد:';
    loadURL(PRAYER_URL);
  }

  function switchToOther(index) {
    currentPhase = 'other';
    timeLeft     = EACH_OTHER_DURATION;
    totalTime    = EACH_OTHER_DURATION;
    modeLabel.textContent = PHASE_NAMES.other;
    phaseText.textContent = 'التبديل بعد:';
    loadURL(OTHER_URLS[index]);
  }

  // الدورة الرئيسية
  setInterval(() => {
    timeLeft--;

    // تحديث العداد وشريط التقدم
    countdown.textContent = formatTime(timeLeft);
    progressBar.style.width = ((timeLeft / totalTime) * 100) + '%';

    if (timeLeft <= 0) {
      if (currentPhase === 'prayer') {
        // انتهت صفحة المواقيت → ابدأ الصفحات الأخرى
        otherIndex = 0;
        switchToOther(otherIndex);
      } else {
        // انتهت صفحة أخرى
        otherIndex++;
        if (otherIndex < OTHER_URLS.length) {
          // انتقل للصفحة الأخرى التالية
          switchToOther(otherIndex);
        } else {
          // انتهت كل الصفحات → ارجع للمواقيت
          switchToPrayer();
        }
      }
    }
  }, 1000);

  // تهيئة العداد
  countdown.textContent = formatTime(timeLeft);
</script>

</body>
</html>
